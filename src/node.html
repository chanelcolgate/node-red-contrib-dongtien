<script type="text/javascript">
  (function () {
    // ------------------------------------------------------------------
    // Preset mẫu cho mapping JSON đầu vào (Cao Su Phú Riềng)
    // ------------------------------------------------------------------
    var CAOSU_PRESETS = {
      phu_rieng_sample: {
        device: 'Cao Su Phú Riềng',
        derivedMetrics: [],
        metrics: [
          { key: 'robot:counter', machineName: 'Số bành mủ', tagValue: 'robot:counter', fieldName: 'value' },
          { key: 'mu_tap:b_run_mlm1', machineName: 'Máy Lùa Mủ 01', tagValue: 'mu_tap:b_run_mlm1', fieldName: 'value' },
          { key: 'mu_tap:b_run_mlm2', machineName: 'Máy Lùa Mủ 02', tagValue: 'mu_tap:b_run_mlm2', fieldName: 'value' },
          { key: 'mu_tap:b_run_mlm3', machineName: 'Máy Lùa Mủ 03', tagValue: 'mu_tap:b_run_mlm3', fieldName: 'value' },
          { key: 'mu_tap:r_freq_mlm1', machineName: 'Tần số MLM1', tagValue: 'mu_tap:r_freq_mlm1', fieldName: 'value' },
          { key: 'mu_tap:r_temp_cm1', machineName: 'Nhiệt độ CM1', tagValue: 'mu_tap:r_temp_cm1', fieldName: 'value' },
          { key: 'r_active_energy', machineName: 'Tổng năng lượng', tagValue: 'r_active_energy', fieldName: 'value' }
        ],
      },
      custom: { device: '', metrics: [], derivedMetrics: [] },
    };

    function csvEscapeField(value) {
      var s = value === undefined || value === null ? '' : String(value);
      if (/[",\n]/.test(s)) {
        s = '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }

    function metricsToCsv(metrics) {
      var lines = ['key,machineName,tagValue,fieldName,lat,long'];
      (metrics || []).forEach(function (m) {
        lines.push(
          [
            csvEscapeField(m.key),
            csvEscapeField(m.machineName),
            csvEscapeField(m.tagValue),
            csvEscapeField(m.fieldName),
            csvEscapeField(m.lat),
            csvEscapeField(m.long),
          ].join(','),
        );
      });
      return lines.join('\n');
    }

    function parseCsv(text) {
      var rows = [];
      var row = [];
      var field = '';
      var inQuotes = false;

      for (var i = 0; i < text.length; i++) {
        var c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            field += c;
          }
        } else if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field);
          field = '';
        } else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
        } else {
          field += c;
        }
      }
      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }
      return rows.filter(function (r) {
        return r.length > 1 || (r.length === 1 && r[0] !== '');
      });
    }

    function metricsFromCsv(text) {
      var rows = parseCsv(text);
      if (rows.length === 0) return [];

      var startIdx = 0;
      var header = rows[0].map(function (h) {
        return h.trim().toLowerCase();
      });
      var isHeader = header.indexOf('key') !== -1 && header.indexOf('machinename') !== -1;
      var colIdx = { key: 0, machineName: 1, tagValue: 2, fieldName: 3, lat: 4, long: 5 };
      if (isHeader) {
        startIdx = 1;
        colIdx = {
          key: header.indexOf('key'),
          machineName: header.indexOf('machinename'),
          tagValue: header.indexOf('tagvalue'),
          fieldName: header.indexOf('fieldname'),
          lat: header.indexOf('lat'),
          long: header.indexOf('long'),
        };
      }

      var result = [];
      for (var i = startIdx; i < rows.length; i++) {
        var r = rows[i];
        var key = (r[colIdx.key] || '').trim();
        if (!key) continue;
        var lat = parseFloat(r[colIdx.lat]);
        var lon = parseFloat(r[colIdx.long]);
        result.push({
          key: key,
          machineName: (r[colIdx.machineName] || '').trim(),
          tagValue: (r[colIdx.tagValue] || '').trim() || key,
          fieldName: (r[colIdx.fieldName] || '').trim() || 'value',
          lat: isNaN(lat) ? undefined : lat,
          long: isNaN(lon) ? undefined : lon,
        });
      }
      return result;
    }

    function downloadTextFile(filename, text) {
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ------------------------------------------------------------------
    // Editable list dùng chung cho bảng mapping (key/machineName/tagValue/fieldName/lat/long)
    // ------------------------------------------------------------------
    function metricsListInit($list, metrics) {
      $list.editableList({
        addButton: false,
        removable: true,
        sortable: true,
        height: 300,
        header: $('<div/>')
          .css({ display: 'flex' })
          .append(
            $('<div/>')
              .css({ width: '20%', display: 'inline-block', fontWeight: 'bold' })
              .text('Key'),
            $('<div/>')
              .css({ width: '20%', display: 'inline-block', fontWeight: 'bold' })
              .text('Machine Name'),
            $('<div/>')
              .css({ width: '20%', display: 'inline-block', fontWeight: 'bold' })
              .text('Tag Value'),
            $('<div/>')
              .css({ width: '15%', display: 'inline-block', fontWeight: 'bold' })
              .text('Field Name'),
            $('<div/>')
              .css({ width: '12%', display: 'inline-block', fontWeight: 'bold' })
              .text('Lat'),
            $('<div/>')
              .css({ width: '13%', display: 'inline-block', fontWeight: 'bold' })
              .text('Long'),
          ),
        addItem: function (container, _index, data) {
          data = data || {};
          var row = $('<div/>').css({ display: 'flex', gap: '4px' }).appendTo(container);

          var keyInput = $('<input/>', { type: 'text', placeholder: 'VD: mu_tap:b_run_mlm1' })
            .css({ width: '20%' })
            .val(data.key || '')
            .appendTo(row);

          var machineInput = $('<input/>', { type: 'text', placeholder: 'VD: Máy Lùa Mủ 01' })
            .css({ width: '20%' })
            .val(data.machineName || '')
            .appendTo(row);

          var tagInput = $('<input/>', { type: 'text', placeholder: 'VD: mu_tap:b_run_mlm1' })
            .css({ width: '20%' })
            .val(data.tagValue || '')
            .appendTo(row);

          var fieldInput = $('<input/>', { type: 'text', placeholder: 'VD: value' })
            .css({ width: '15%' })
            .val(data.fieldName || 'value')
            .appendTo(row);

          var latInput = $('<input/>', { type: 'number', step: 'any', placeholder: 'VD: 10.1234' })
            .css({ width: '12%' })
            .val(data.lat !== undefined && data.lat !== null ? data.lat : '')
            .appendTo(row);

          var longInput = $('<input/>', { type: 'number', step: 'any', placeholder: 'VD: 106.1234' })
            .css({ width: '13%' })
            .val(data.long !== undefined && data.long !== null ? data.long : '')
            .appendTo(row);

          container.data('_inputs', {
            keyInput: keyInput,
            machineInput: machineInput,
            tagInput: tagInput,
            fieldInput: fieldInput,
            latInput: latInput,
            longInput: longInput,
          });
        },
      });

      (metrics || []).forEach(function (m) {
        $list.editableList('addItem', m);
      });
    }

    function metricsListGetValue($list) {
      var result = [];
      $list.editableList('items').each(function () {
        var inputs = $(this).data('_inputs');
        if (!inputs) return;
        var key = (inputs.keyInput.val() || '').trim();
        if (!key) return;
        var lat = parseFloat(inputs.latInput.val());
        var lon = parseFloat(inputs.longInput.val());
        result.push({
          key: key,
          machineName: (inputs.machineInput.val() || '').trim(),
          tagValue: (inputs.tagInput.val() || '').trim() || key,
          fieldName: (inputs.fieldInput.val() || '').trim() || 'value',
          lat: Number.isFinite(lat) ? lat : undefined,
          long: Number.isFinite(lon) ? lon : undefined,
        });
      });
      return result;
    }

    function metricsListReplace($list, metrics) {
      $list.editableList('empty');
      (metrics || []).forEach(function (m) {
        $list.editableList('addItem', m);
      });
    }

    // ------------------------------------------------------------------
    // Editable list cho "Đại lượng tính toán" (vector magnitude): (unchanged)
    // ------------------------------------------------------------------
    function derivedListInit($list, derivedMetrics) {
      $list.editableList({
        addButton: 'Thêm phép tính',
        removable: true,
        sortable: true,
        height: 160,
        header: $('<div/>').css({ display: 'flex' }).append(
          $('<div/>').css({ width: '14%', display: 'inline-block', fontWeight: 'bold' }).text('Key kết quả'),
          $('<div/>').css({ width: '24%', display: 'inline-block', fontWeight: 'bold' }).text('Tên hiển thị'),
          $('<div/>').css({ width: '12%', display: 'inline-block', fontWeight: 'bold' }).text('Đơn vị'),
          $('<div/>').css({ width: '16%', display: 'inline-block', fontWeight: 'bold' }).text('Biến X'),
          $('<div/>').css({ width: '16%', display: 'inline-block', fontWeight: 'bold' }).text('Biến Y'),
          $('<div/>').css({ width: '16%', display: 'inline-block', fontWeight: 'bold' }).text('Biến Z')
        ),
        addItem: function (container, _index, data) {
          data = data || {};
          var row = $('<div/>').css({ display: 'flex', gap: '4px' }).appendTo(container);

          var keyInput = $('<input/>', { type: 'text', placeholder: 'VD: D_disp' }).css({ width: '14%' }).val(data.key || '').appendTo(row);
          var nameInput = $('<input/>', { type: 'text', placeholder: 'VD: Displacement Magnitude' }).css({ width: '24%' }).val(data.name || '').appendTo(row);
          var unitInput = $('<input/>', { type: 'text', placeholder: 'VD: um' }).css({ width: '12%' }).val(data.unit || '').appendTo(row);
          var xInput = $('<input/>', { type: 'text', placeholder: 'VD: x-disp' }).css({ width: '16%' }).val(data.xKey || '').appendTo(row);
          var yInput = $('<input/>', { type: 'text', placeholder: 'VD: y-disp' }).css({ width: '16%' }).val(data.yKey || '').appendTo(row);
          var zInput = $('<input/>', { type: 'text', placeholder: 'VD: z-disp' }).css({ width: '16%' }).val(data.zKey || '').appendTo(row);

          container.data('_inputs', { keyInput: keyInput, nameInput: nameInput, unitInput: unitInput, xInput: xInput, yInput: yInput, zInput: zInput });
        },
      });

      (derivedMetrics || []).forEach(function (d) {
        $list.editableList('addItem', d);
      });
    }

    function derivedListGetValue($list) {
      var result = [];
      $list.editableList('items').each(function () {
        var inputs = $(this).data('_inputs');
        if (!inputs) return;
        var key = (inputs.keyInput.val() || '').trim();
        var xKey = (inputs.xInput.val() || '').trim();
        var yKey = (inputs.yInput.val() || '').trim();
        var zKey = (inputs.zInput.val() || '').trim();
        if (!key || !xKey || !yKey || !zKey) return;
        result.push({ key: key, name: (inputs.nameInput.val() || '').trim() || key, unit: (inputs.unitInput.val() || '').trim(), xKey: xKey, yKey: yKey, zKey: zKey });
      });
      return result;
    }

    function derivedListReplace($list, derivedMetrics) {
      $list.editableList('empty');
      (derivedMetrics || []).forEach(function (d) {
        $list.editableList('addItem', d);
      });
    }

    // ==================================================================
    // Config node: caosu-pr-meter-config
    // ==================================================================
    RED.nodes.registerType('caosu-pr-meter-config', {
      category: 'config',
      defaults: {
        name: { value: '', required: true },
        device: { value: '' },
        metrics: { value: [] },
        derivedMetrics: { value: [] },
      },
      label: function () {
        return this.name || this.device || 'meter-config';
      },
      oneditprepare: function () {
        var $list = $('#node-config-input-metrics-container');
        var $derivedList = $('#node-config-input-derived-container');
        metricsListInit($list, this.metrics);
        derivedListInit($derivedList, this.derivedMetrics);

        // Preset
        $('.caosu-preset-btn').on('click', function () {
          var key = $(this).data('preset');
          var tpl = CAOSU_PRESETS[key];
          if (!tpl) return;

          if (($list.editableList('length') > 0 || $derivedList.editableList('length') > 0) && !window.confirm('Thao tác này sẽ thay thế toàn bộ bảng mapping và đại lượng tính toán hiện tại. Tiếp tục?')) {
            return;
          }

          metricsListReplace($list, tpl.metrics);
          derivedListReplace($derivedList, tpl.derivedMetrics);
          if (tpl.device && !$('#node-config-input-device').val()) {
            $('#node-config-input-device').val(tpl.device);
          }
        });

        $('#node-config-add-row').on('click', function () {
          $list.editableList('addItem', {});
        });

        // Export CSV
        $('#node-config-export-csv').on('click', function () {
          var metrics = metricsListGetValue($list);
          var name = $('#node-config-input-name').val() || 'meter-config';
          downloadTextFile(name.replace(/[^\w-]+/g, '_') + '.csv', metricsToCsv(metrics));
        });

        // Import CSV
        $('#node-config-import-csv-trigger').on('click', function () {
          $('#node-config-import-csv-file').click();
        });

        $('#node-config-import-csv-file').on('change', function (evt) {
          var file = evt.target.files && evt.target.files[0];
          if (!file) return;

          var reader = new FileReader();
          reader.onload = function (e) {
            try {
              var metrics = metricsFromCsv(String(e.target.result));
              if (metrics.length === 0) {
                window.alert('Không đọc được dòng dữ liệu hợp lệ nào trong file CSV.');
                return;
              }
              if ($list.editableList('length') > 0 && !window.confirm('Import sẽ thay thế toàn bộ bảng mapping hiện tại bằng ' + metrics.length + ' dòng từ file CSV. Tiếp tục?')) {
                return;
              }
              metricsListReplace($list, metrics);
            } catch (err) {
              window.alert('Lỗi đọc file CSV: ' + err.message);
            }
          };
          reader.readAsText(file);
          $(this).val('');
        });
      },
      oneditsave: function () {
        var $list = $('#node-config-input-metrics-container');
        var $derivedList = $('#node-config-input-derived-container');
        this.metrics = metricsListGetValue($list);
        this.derivedMetrics = derivedListGetValue($derivedList);
      },
    });

    // ==================================================================
    // Node chính: caosu-pr-insert
    // ==================================================================
    RED.nodes.registerType('caosu-pr-insert', {
      category: 'Cao Su Phu Rieng',
      color: '#927FBF',
      defaults: {
        name: { value: '' },
        meterConfig: { value: '', type: 'caosu-pr-meter-config', required: true },
        factory: { value: 'Cao Su Phu Rieng', required: true },
        system: { value: '' },
        sub_system: { value: '' },
        measurement: { value: 'caosu_measurement', required: true },
        db: { value: 'caosu_phu_rieng', required: true },
        precision: { value: 'ns' },
        latitude: { value: '' },
        longitude: { value: '' },
      },
      inputs: 1,
      outputs: 1,
      icon: 'font-awesome/fa-bolt',
      paletteLabel: 'caosu-pr-insert',
      label: function () {
        if (this.name) return this.name;
        var cfg = RED.nodes.node(this.meterConfig);
        return (cfg && (cfg.name || cfg.device)) || 'caosu-pr-insert';
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
    });
  })();
</script>

<script type="text/html" data-template-name="caosu-pr-meter-config">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Tên template</label>
    <input type="text" id="node-config-input-name" placeholder="VD: Phu Rieng Template" />
  </div>

  <div class="form-row">
    <label for="node-config-input-device"><i class="fa fa-microchip"></i> Tag "device"</label>
    <input type="text" id="node-config-input-device" placeholder="VD: Cao Su Phu Rieng" />
  </div>

  <div class="form-row">
    <label style="width: auto"><i class="fa fa-magic"></i> Preset</label>
    <button type="button" class="red-ui-button caosu-preset-btn" data-preset="phu_rieng_sample">Phú Riềng - Mẫu</button>
  </div>
  <div class="form-tips">
    <i class="fa fa-info-circle"></i> Preset mẫu cho mapping JSON của Phú Riềng.
  </div>

  <hr />

  <div class="form-row">
    <button type="button" class="red-ui-button" id="node-config-add-row"><i class="fa fa-plus"></i> Thêm dòng</button>
    <button type="button" class="red-ui-button" id="node-config-export-csv"><i class="fa fa-download"></i> Export CSV</button>
    <button type="button" class="red-ui-button" id="node-config-import-csv-trigger"><i class="fa fa-upload"></i> Import CSV</button>
    <input type="file" id="node-config-import-csv-file" accept=".csv" style="display: none" />
  </div>

  <div class="form-row">
    <ol id="node-config-input-metrics-container" style="min-height: 260px"></ol>
  </div>

  <div class="form-tips">
    <i class="fa fa-info-circle"></i> File CSV cần có cột <code>key,machineName,tagValue,fieldName,lat,long</code> (có dòng tiêu đề hoặc không).
  </div>
  <div class="form-row">
    <ol id="node-config-input-derived-container" style="min-height: 100px"></ol>
  </div>
</script>

<script type="text/html" data-help-name="caosu-pr-meter-config">
  <p>
    Config node dùng chung: chứa bảng mapping "khóa JSON → machineName / tagValue / fieldName / lat / long" cho dữ liệu JSON đầu vào của Phú Riềng. Dùng mapping này để sinh Influx Line Protocol.
  </p>
  <ul>
    <li><b>Preset</b>: nạp nhanh bằng mapping mẫu theo loại dữ liệu.</li>
    <li><b>Export/Import CSV</b>: xuất bảng hiện tại ra file CSV để chỉnh sửa/lưu trữ, hoặc nạp lại từ file CSV (cột: <code>key,machineName,tagValue,fieldName,lat,long</code>).</li>
  </ul>
</script>
